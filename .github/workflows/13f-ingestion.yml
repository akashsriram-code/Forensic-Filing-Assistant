name: 13F Ingestion

# Keeps the compact Postgres 13F store (lib/thirteen-f-store.ts) current and commits the small precomputed
# radar JSON in data/13f-precomputed/. No raw holdings are kept in Postgres and nothing uses Git LFS.

on:
  schedule:
    - cron: '17 11 * * *'  # Daily
    # TEMPORARY: hourly during the 2026-Q3 filing-deadline crunch (deadline Mon 2026-11-16).
    # The `gate` job turns these runs into no-ops after Tue 2026-11-17 (UTC); delete this line afterwards.
    # Hour 11 is skipped because the daily cron above already covers it.
    - cron: '17 0-10,12-23 * * *'
  workflow_dispatch:
    inputs:
      quarter:
        description: 'Report quarter being filed, e.g. 2026-Q3. Blank = most recent completed quarter.'
        required: false
        type: string
      mode:
        description: 'Which stage to run.'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - live
          - bulk
          - precompute

concurrency:
  group: 13f-ingestion
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check temporary hourly window
        id: check
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          HOURLY_UNTIL="2026-11-17"  # last UTC day of the temporary hourly schedule
          if [ "$EVENT_SCHEDULE" = "17 0-10,12-23 * * *" ] && [ "$(date -u +%F)" \> "$HOURLY_UNTIL" ]; then
            echo "Hourly window ended $HOURLY_UNTIL; skipping. Remove the hourly cron from this workflow."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  ingest-13f:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL || secrets.DATABASE_URL || secrets.POSTGRES_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL || secrets.AIVEN_DATABASE_URL || secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'SCOUT contact@example.com' }}
      REQUESTED_QUARTER: ${{ inputs.quarter || '' }}
      REQUESTED_MODE: ${{ inputs.mode || 'auto' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate database configuration
        run: |
          if [ -z "$DATABASE_URL" ] && [ -z "$POSTGRES_URL" ]; then
            echo "::error title=Missing Postgres database secret::Set AIVEN_DATABASE_URL, DATABASE_URL, or POSTGRES_URL."
            exit 1
          fi

      - name: Resolve ingestion schedule
        id: schedule
        run: |
          if [ -n "$REQUESTED_QUARTER" ]; then
            npx tsx scripts/resolve-13f-schedule.ts --quarter "$REQUESTED_QUARTER" --github-output
          else
            npx tsx scripts/resolve-13f-schedule.ts --github-output
          fi

      - name: Live EDGAR ingestion
        id: live_ingest
        if: env.REQUESTED_MODE == 'live' || (env.REQUESTED_MODE == 'auto' && steps.schedule.outputs.live_active == 'true')
        run: npx tsx scripts/ingest-live-13f.ts --quarter "${{ steps.schedule.outputs.quarter }}" --concurrency 8 --rate-limit-ms 110

      - name: Resolve SEC bulk data sets for the stored pair
        id: datasets
        if: env.REQUESTED_MODE == 'bulk' || env.REQUESTED_MODE == 'auto'
        run: npx tsx scripts/resolve-13f-store-datasets.ts --github-output

      - name: Rebuild store from SEC bulk data
        id: bulk_build
        if: |
          steps.datasets.outputs.complete == 'true' &&
          (env.REQUESTED_MODE == 'bulk' || steps.datasets.outputs.up_to_date != 'true')
        run: |
          DIRS=()
          for URL in ${{ steps.datasets.outputs.urls }}; do
            NAME=$(basename "$URL" .zip)
            mkdir -p "downloads/sec-13f-datasets/$NAME"
            curl -fsSL -A "$SEC_USER_AGENT" -o "downloads/sec-13f-datasets/$NAME/$NAME.zip" "$URL"
            unzip -q -o "downloads/sec-13f-datasets/$NAME/$NAME.zip" -d "downloads/sec-13f-datasets/$NAME/extracted"
            DIRS+=("downloads/sec-13f-datasets/$NAME/extracted")
          done
          DATASETS=$(IFS=,; echo "${DIRS[*]}")
          node --max-old-space-size=6144 node_modules/tsx/dist/cli.mjs scripts/build-13f-store.ts \
            --current "${{ steps.datasets.outputs.current }}" --previous "${{ steps.datasets.outputs.previous }}" --prior "${{ steps.datasets.outputs.prior }}" \
            --datasets "$DATASETS"

      - name: Precompute default radar view
        if: |
          always() &&
          (steps.live_ingest.outcome == 'success' || steps.bulk_build.outcome == 'success' || env.REQUESTED_MODE == 'precompute')
        run: node --max-old-space-size=4096 node_modules/tsx/dist/cli.mjs scripts/precompute-13f-radar.ts

      - name: Database size guard
        if: always()
        run: npx tsx scripts/size-13f-neon.ts --require-under-target

      - name: Commit precomputed radar files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/13f-precomputed/
          if git diff --staged --quiet; then
            echo "No precomputed changes to commit."
            exit 0
          fi
          git commit -m "Update 13F precomputed radar (${{ steps.schedule.outputs.quarter }})"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Pushed updated 13F precomputed radar." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not push precomputed radar files after 3 attempts."
          exit 1
