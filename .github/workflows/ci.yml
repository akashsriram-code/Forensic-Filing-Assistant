name: CI

# Typecheck, lint, unit tests and a production build on every push and pull request, so a broken change shows up
# here instead of in front of a reporter on deadline.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc -p extension --noEmit

      # Files below still have older lint errors. Remove a line once its file is fixed; every other file in app/,
      # lib/ and scripts/ (including all new files) must lint clean.
      - name: Lint
        run: >
          npx eslint app lib scripts extension/src
          --ignore-pattern scripts/ingest-13f-raw.ts
          --ignore-pattern scripts/ingest-turso-direct.ts
          --ignore-pattern scripts/migrate-turso.ts
          --ignore-pattern scripts/retry-ingest.ts

      - name: Unit tests
        run: |
          npm run test:13f-radar
          npm run test:13f-ingestion
          npm run test:spacex-exposure-radar
          npm run test:diff
          npm run test:entity
          npm run test:form4
          npm run test:extension

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Build SCOUT Live extension
        run: npm run build:extension -- --zip

      - name: Upload SCOUT Live extension
        uses: actions/upload-artifact@v4
        with:
          name: scout-live-extension
          path: exports/scout-live.zip
          if-no-files-found: error
